<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S</title>
  <style>
    :root {
      --cyan: #00f3ff;
      --cyan-dim: rgba(0, 243, 255, 0.2);
      --bg: #050a14;
      --panel: rgba(10, 22, 40, 0.85);
      --red: #ff3b5c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, monospace;
    }

    body {
      background-color: var(--bg);
      color: var(--cyan);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      letter-spacing: 6px;
      font-size: 1.8rem;
      text-shadow: 0 0 12px var(--cyan);
    }

    header p {
      font-size: 0.75rem;
      letter-spacing: 3px;
      opacity: 0.7;
    }

    /* Animated Core */
    .core {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
    }

    .r1 {
      width: 100%;
      height: 100%;
      border-top-color: var(--cyan);
      border-bottom-color: var(--cyan);
      animation: spin 4s linear infinite;
    }

    .r2 {
      width: 75%;
      height: 75%;
      border-left-color: var(--cyan);
      border-right-color: var(--cyan);
      animation: spin-reverse 2.5s linear infinite;
    }

    .center {
      width: 40%;
      height: 40%;
      background: radial-gradient(circle, #fff 10%, var(--cyan) 60%, transparent 100%);
      border-radius: 50%;
      box-shadow: 0 0 20px var(--cyan);
      animation: pulse 2s ease-in-out infinite;
    }

    .core-text {
      font-size: 0.8rem;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }

    /* System Status Panel */
    .status {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--cyan-dim);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .status h2 {
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--cyan-dim);
      padding-bottom: 6px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 4px 0;
    }

    .on { color: #00ff88; }
    .off { color: var(--red); }

    /* Chat Display */
    .chat {
      width: 100%;
      max-width: 420px;
      flex: 1;
      min-height: 160px;
      max-height: 260px;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--cyan-dim);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.9rem;
    }

    .msg-user {
      align-self: flex-end;
      background: rgba(0, 243, 255, 0.15);
      padding: 8px 12px;
      border-radius: 8px 8px 0 8px;
      color: #fff;
    }

    .msg-jarvis {
      align-self: flex-start;
      border-left: 2px solid var(--cyan);
      padding-left: 10px;
    }

    /* Input Area */
    .input-area {
      width: 100%;
      max-width: 420px;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--cyan);
      border-radius: 6px;
      padding: 10px 12px;
      color: #fff;
      outline: none;
    }

    button {
      background: var(--cyan);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      padding: 0 18px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:active { opacity: 0.8; }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 1; }
    }
